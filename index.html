<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SuperMarket Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#18231d;background:radial-gradient(circle at 10% 10%,#dcefe4,transparent 28%),radial-gradient(circle at 90% 90%,#e5f4e9,transparent 30%),#f5f8f6}.app{width:min(1050px,95vw);height:min(860px,94vh);margin:3vh auto;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;background:#ffffffdd;backdrop-filter:blur(18px);border:1px solid #fff;border-radius:28px;box-shadow:0 24px 70px #244b351c}.head{display:flex;align-items:center;gap:14px;padding:20px 24px;border-bottom:1px solid #dce8df}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#198754,#72c993);color:#fff;font-size:25px}.head h1{margin:0;font-size:20px}.head p{margin:4px 0 0;color:#718078;font-size:13px}#chat{overflow-y:auto;padding:28px clamp(14px,4vw,44px);scroll-behavior:smooth}.welcome{max-width:650px;margin:30px auto;padding:28px;border:1px solid #dce8df;border-radius:24px;background:#ffffffbb;text-align:center}.welcome .icon{font-size:42px}.welcome h2{margin:10px 0 8px}.welcome p{color:#718078;line-height:1.6;margin:0}.row{display:flex;margin:13px 0}.row.user{justify-content:flex-end}.bubble{max-width:min(78%,720px);padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{color:#fff;background:#198754;border-bottom-right-radius:6px}.model .bubble{background:#eef6f0;border:1px solid #dce8df;border-bottom-left-radius:6px}.typing{display:flex;gap:5px;padding:15px 17px}.typing i{width:7px;height:7px;border-radius:50%;background:#78a28a;animation:bounce 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}form{display:flex;gap:10px;padding:16px;border-top:1px solid #dce8df;background:#ffffffcc}textarea{flex:1;resize:none;min-height:52px;max-height:130px;padding:15px 17px;border:1px solid #dce8df;border-radius:17px;outline:0;font:inherit;background:#fff}textarea:focus{border-color:#7fba98;box-shadow:0 0 0 4px #19875412}button{align-self:flex-end;width:52px;height:52px;border:0;border-radius:16px;color:#fff;background:#198754;cursor:pointer;font-size:21px}button:hover{background:#126a41}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:650px){.app{width:100vw;height:100vh;margin:0;border-radius:0}.bubble{max-width:88%}.head{padding:17px}#chat{padding:20px 13px}}
</style>
</head>
<body>
<main class="app">
<header class="head"><div class="logo">🛒</div><div><h1>SuperMarket Assistant</h1><p>Smart help for supermarket & grocery questions</p></div></header>
<section id="chat" aria-live="polite"><div class="welcome" id="welcome"><div class="icon">🛍️</div><h2>Welcome!</h2><p>Ask about groceries, product categories, shopping lists, labels, storage, or other supermarket-related topics.</p></div></section>
<form id="form"><textarea id="message" rows="1" placeholder="Ask a supermarket question..." aria-label="Message"></textarea><button id="send" type="submit" aria-label="Send">➤</button></form>
</main>
<script>
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("message"),send=document.getElementById("send"),history=[];
function add(role,text){document.getElementById("welcome")?.remove();const r=document.createElement("div");r.className="row "+role;const b=document.createElement("div");b.className="bubble";b.textContent=text;r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
function typing(){const r=document.createElement("div");r.className="row model";r.id="typing";const b=document.createElement("div");b.className="bubble typing";b.innerHTML="<i></i><i></i><i></i>";r.appendChild(b);chat.appendChild(r);chat.scrollTop=chat.scrollHeight}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,130)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener("submit",async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add("user",message);history.push({role:"user",text:message});input.value="";input.style.height="auto";send.disabled=true;typing();
try{const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history})});const data=await res.json();document.getElementById("typing")?.remove();if(!res.ok)throw new Error();add("model",data.reply);history.push({role:"model",text:data.reply})}catch{document.getElementById("typing")?.remove();add("model","Sorry, I couldn't process that request right now. Please try again.")}finally{send.disabled=false;input.focus()}});
</script>
</body>
</html>
